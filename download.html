<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voidacity</title>
  <link rel="icon" type="image/x-icon" href="public/favicon.ico">
  <link rel="apple-touch-icon" href="public/icons/apple-touch-icon.png">
  <link rel="manifest" href="public/manifest.json">
  <link rel="stylesheet" href="src/assets/css/style.css">
</head>
<body>
<div class="nav-bar">
  <a href="index.html" class="logo-link">
    <h1 class="nav-name">Voidacity</h1>
  </a>
  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="tools.html" class="nav-link">Tools</a>
    <a href="download.html" class="nav-link">Download</a>
  </nav>
</div>

<main class="box">
  <input type="text" id="honeypot" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

  <div class="version-box">
    <h2 class="tool-card-title">Windows download</h2>
    <p class="tool-card-description">Download the Windows installer. Its SHA-256 checksum is shown when verification is available.</p>
    <div class="version-list">
      <div class="version-item">
        <div class="version-meta">
          <span class="version-title-text">Windows</span>
        </div>

        <div class="download-options">
          <div class="download-block">
            <a class="btn-home" data-file="exe" data-download="downloads/voidacity.exe" aria-disabled="true">
              <svg class="win-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <path fill="currentColor" d="M96 157.7L279.6 132.4L279.6 309.8L96 309.8L96 157.7zM96 482.3L279.6 507.6L279.6 332.4L96 332.4L96 482.3zM299.8 510.3L544 544L544 332.4L299.8 332.4L299.8 510.3zM299.8 129.7L299.8 309.8L544 309.8L544 96L299.8 129.7z">
              </svg>
              <span>Checking Windows download...</span>
            </a>
            <div class="hash-display" id="hash-exe">
              SHA-256 unavailable
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <p>&copy; <span id="year"></span> Voidacity. All rights reserved.</p>
</footer>

<script src="src/core/holiday-themes.js"></script>
<script src="src/core/security/honeypot.js"></script>
<script src="src/core/security/checksum.js"></script>
<script src="src/main.js"></script>
</body>
</html>
